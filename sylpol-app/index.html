<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Σύλλογος Πολυτέκνων Αγρινίου | Ψηφιακό Μητρώο</title><link rel="stylesheet" href="app.css"></head><body>
<div id="login" class="login"><section class="hero"><div class="seal"></div><div class="org">Σύλλογος Πολυτέκνων Αγρινίου & Περιχώρων</div><h1>Ψηφιακό Μητρώο</h1><p>Μέλη, οικογένειες, συνδρομές, παροχές, πρωτόκολλο και έγγραφα σε μία ασφαλή εφαρμογή.</p></section><form id="auth" class="auth"><div class="switch"><button type="button" id="slogin" class="on">Σύνδεση</button><button type="button" id="sactivate">Πρώτη ενεργοποίηση</button></div><h2 id="authTitle">Σύνδεση χρήστη</h2><label id="nameWrap" class="hide">Ονοματεπώνυμο<input id="fullName"></label><label id="codeWrap" class="hide">Κωδικός ενεργοποίησης<input id="setupCode" autocomplete="off"></label><label>Email<input id="email" type="email" required></label><label>Κωδικός πρόσβασης<input id="password" type="password" minlength="8" required></label><button class="btn primary wide" id="authBtn">Σύνδεση</button><div id="authMsg" class="msg hide"></div></form></div>
<div id="app" class="app hide"><aside><div class="brand"><div class="seal"></div><div><b>SYLPOL Αγρινίου</b><small>Ψηφιακό Μητρώο</small></div></div><nav id="nav"><button data-view="dashboard" class="on">▦ Αρχική</button><button data-view="members">♟ Μέλη</button><button data-view="families">♧ Οικογένειες / Τέκνα</button><button data-view="subscriptions">€ Συνδρομές</button><button data-view="benefits">✓ Παροχές / Αιτήσεις</button><button data-view="protocols">№ Πρωτόκολλο</button><button data-view="documents">▤ Έγγραφα</button></nav><div class="user"><div id="userName"></div><button id="logout">Αποσύνδεση</button></div></aside><main id="content"></main></div>
