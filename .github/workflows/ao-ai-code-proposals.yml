name: AΩ AI — autonomous code-proposal research
on:
  schedule:
    # Research-only cycle every four hours until 2027-05-06 UTC; best-effort.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ao-ai-code-proposals.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: ao-ai-code-proposals
  cancel-in-progress: false
jobs:
  proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check bounded research dates
        id: window
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(date -u +%Y-%m-%d)"
          if [[ "$TODAY" > "2026-11-05" && "$TODAY" < "2027-05-07" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Outside experiment window; no proposals generated."
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.window.outputs.active == 'true'
        with:
          persist-credentials: false
      - name: Verify generation, independent validation and retention safety gates
        if: steps.window.outputs.active == 'true'
        run: python3 -m unittest discover -s AO-AI/research -p 'test_*.py' -q
      - name: Recover previous approved research recipe as JSON data only
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS="$(gh run list --workflow ao-ai-code-proposals.yml \
            --status success --limit 20 --json databaseId \
            --jq '.[].databaseId' | grep -vx "$GITHUB_RUN_ID" | head -n 1 || true)"
          if [[ "$PREVIOUS" =~ ^[0-9]+$ ]]; then
            gh run download "$PREVIOUS" \
              --name "ao-ai-code-proposal-$PREVIOUS" \
              --dir previous || true
          fi
      - name: Synthesize and check candidate code (NO commits)
        if: steps.window.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 AO-AI/research/self_improve.py \
            --run-key "$GITHUB_RUN_ID" \
            --output-dir candidate \
            --previous-champion previous/champion.json \
            --train-count 60 \
            --holdout-count 200 \
            --population 10 \
            --generations 4
          echo '## AΩ — executable code proposal' >> "$GITHUB_STEP_SUMMARY"
          echo 'Generated Python for review ONLY — not committed, merged or deployed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Synthetic findings are exploratory; no breakthrough claimed.' >> "$GITHUB_STEP_SUMMARY"
          # Expose repeatability and cross-run inheritance in the run summary.
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("candidate/proposal.json").read_text())
          c = json.loads(Path("candidate/cycle.json").read_text())
          print(f"Previous validated research champion: {c['previous_validated_champion_used']}")
          print(f"Independent cases: {c['independent_synthetic_cases']}, seeds: {c['independent_seed_blocks']}")
          print(f"Research-only promotion decision: {c['gate_decision']}")
          print("No source merge, deployment or real-world activity.")
          PY
      - name: Archive reproducible proposed source and evidence
        if: steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ao-ai-code-proposal-${{ github.run_id }}
          path: |
            candidate/candidate_optimizer.py
            candidate/proposal.json
            candidate/verification.json
            candidate/champion.json
            candidate/cycle.json
          retention-days: 35
          if-no-files-found: error
