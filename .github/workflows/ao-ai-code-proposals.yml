name: AΩ AI — autonomous code-proposal research
on:
  schedule:
    # Every four hours during the 30-day study, best-effort.
    - cron: '23 1,5,9,13,17,21 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ao-ai-code-proposals.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: ao-ai-code-proposals
  cancel-in-progress: false
jobs:
  proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check bounded research dates
        id: window
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(date -u +%Y-%m-%d)"
          if [[ "$TODAY" > "2026-11-05" && "$TODAY" < "2026-12-06" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Outside experiment window; no proposals generated."
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.window.outputs.active == 'true'
        with:
          persist-credentials: false
      - name: Test the code-proposal compiler and integrity gates
        if: steps.window.outputs.active == 'true'
        run: python3 -m unittest discover -s AO-AI/research -p 'test_code_proposals.py' -v
      - name: Recover prior training-selected recipe as JSON data only
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS="$(gh run list --workflow ao-ai-code-proposals.yml \
            --status success --limit 20 --json databaseId \
            --jq '.[].databaseId' | grep -vx "$GITHUB_RUN_ID" | head -n 1 || true)"
          if [[ "$PREVIOUS" =~ ^[0-9]+$ ]]; then
            gh run download "$PREVIOUS" \
              --name "ao-ai-code-proposal-$PREVIOUS" \
              --dir previous || true
          fi
      - name: Synthesize and check candidate code (NO commits)
        if: steps.window.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 AO-AI/research/code_proposals.py \
            --run-key "$GITHUB_RUN_ID" \
            --output-dir candidate \
            --previous-report previous/proposal.json \
            --train-count 60 \
            --holdout-count 200 \
            --population 10 \
            --generations 4
          echo '## AΩ — executable code proposal' >> "$GITHUB_STEP_SUMMARY"
          echo 'Generated Python for review ONLY — not committed, merged or deployed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Synthetic findings are exploratory; no breakthrough claimed.' >> "$GITHUB_STEP_SUMMARY"
          # Expose repeatability and cross-run inheritance in the run summary.
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("candidate/proposal.json").read_text())
          print(f"Previous validated training recipe inherited: {r['inherited_recipe_used']}")
          print(f"Methods tested: {r['methods_evaluated']}; holdout delta: {r['holdout_delta']}")
          print("Candidate code is not deployed or merged.")
          PY
      - name: Archive reproducible proposed source and evidence
        if: steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ao-ai-code-proposal-${{ github.run_id }}
          path: |
            candidate/candidate_optimizer.py
            candidate/proposal.json
          retention-days: 35
          if-no-files-found: error
