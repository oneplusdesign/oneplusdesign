name: AΩ AI — infrastructure container smoke test
on:
  push:
    paths:
      - 'AO-AI/Dockerfile'
      - 'AO-AI/compose.yaml'
      - 'AO-AI/.dockerignore'
      - 'AO-AI/research/always_on_worker.py'
      - 'AO-AI/research/test_always_on_worker.py'
      - 'AO-AI/research/self_improve.py'
      - 'AO-AI/research/verification_gate.py'
      - '.github/workflows/ao-ai-infrastructure-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate isolated container configuration
        run: docker compose -f AO-AI/compose.yaml config -q
      - name: Build the research-only container and run all tests
        run: docker compose -f AO-AI/compose.yaml build
      - name: Run one real bounded research cycle without network
        run: |
          set -euo pipefail
          docker compose -f AO-AI/compose.yaml run --rm ao-ai-worker             --limit 1 --pause-seconds 0
      - name: Verify persisted healthy heartbeat after container restart
        run: |
          set -euo pipefail
          docker compose -f AO-AI/compose.yaml run --rm ao-ai-worker             --healthcheck --state-dir /state
      - name: Cleanup the ephemeral test infrastructure
        if: always()
        run: docker compose -f AO-AI/compose.yaml down --volumes --remove-orphans || true
