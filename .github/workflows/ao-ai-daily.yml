name: AΩ AI — consecutive research cycles
# PAUSED at repository owner's explicit request on 2026-11-09.
# No schedules, push or pull_request triggers. All jobs intentionally disabled.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ao-ai-research-series
  cancel-in-progress: false
jobs:
  series:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - name: Check time window
        id: window
        shell: bash
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          if [[ "$TODAY" > "2026-11-05" && "$TODAY" < "2026-12-06" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Outside trial dates: no research executed."
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.window.outputs.active == 'true'
        with:
          persist-credentials: false
      - name: Verify reproducible research code
        if: steps.window.outputs.active == 'true'
        run: python3 -m unittest discover -s AO-AI/research -p 'test_*.py' -v
      - name: Recover training-only policy from previous research artifact
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Read-only access to our own prior run. Never execute artifact data.
          PREVIOUS="$(gh run list --workflow ao-ai-daily.yml --status success \
            --limit 20 --json databaseId --jq '.[].databaseId' \
            | grep -vx "${{ github.run_id }}" | head -n 1 || true)"
          if [[ -n "$PREVIOUS" && "$PREVIOUS" =~ ^[0-9]+$ ]]; then
            gh run download "$PREVIOUS" \
              --name "ao-ai-series-$PREVIOUS" --dir previous || true
          fi
      - name: Run one experiment immediately after another
        if: steps.window.outputs.active == 'true'
        run: |
          python3 AO-AI/research/continuous_research.py \
            --run-date "${{ steps.window.outputs.date }}" \
            --run-key "${{ github.run_id }}" \
            --duration-seconds 1440 \
            --max-experiments 0 \
            --count 40 \
            --resume previous/ao-research-series.json \
            --output ao-research-series.json
          echo "### AΩ | AI — Consecutive synthetic research experiments" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: ${{ github.run_id }} / Date: ${{ steps.window.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Comparative synthetic baselines only; no scientific breakthrough claimed." >> "$GITHUB_STEP_SUMMARY"
      - name: Archive independently reproducible aggregate report
        if: ${{ always() && steps.window.outputs.active == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ao-ai-series-${{ github.run_id }}
          path: ao-research-series.json
          retention-days: 35
          if-no-files-found: warn
