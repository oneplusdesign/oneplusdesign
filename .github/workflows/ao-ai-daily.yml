name: AΩ AI — 30-day research heartbeat
on:
  schedule:
    # UTC. Runs daily during the defined research window; note schedule delays are possible.
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ao-ai-daily-research
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check the 30-day window
        id: window
        shell: bash
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          if [[ "$TODAY" > "2026-11-05" && "$TODAY" < "2026-12-06" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Study window expired; no experiment will be executed."
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.window.outputs.active == 'true'
        with:
          persist-credentials: false
      - name: Verify the scheduled study
        if: steps.window.outputs.active == 'true'
        run: python3 -m unittest discover -s AO-AI/research -p 'test_*.py' -v
      - name: Run new synthetic cases with a calendar seed
        if: steps.window.outputs.active == 'true'
        run: |
          python3 AO-AI/research/daily_study.py --run-date "${{ steps.window.outputs.date }}" --output daily-report.json
          echo "### AΩ | AI — Synthetic research heartbeat" >> "$GITHUB_STEP_SUMMARY"
          echo "Date: ${{ steps.window.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline-only evaluation: no scientific breakthrough claimed." >> "$GITHUB_STEP_SUMMARY"
          echo "The machine-readable results are in the run artifact." >> "$GITHUB_STEP_SUMMARY"
      - name: Save verifiable daily report
        if: steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ao-ai-report-${{ steps.window.outputs.date }}
          path: daily-report.json
          retention-days: 90
          if-no-files-found: error
