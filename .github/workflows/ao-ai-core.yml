name: AΩ AI — core tests
on:
  push:
    paths:
      - 'AO-AI/**'
      - '.github/workflows/ao-ai-core.yml'
  pull_request:
    paths:
      - 'AO-AI/**'
      - '.github/workflows/ao-ai-core.yml'
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show runtime
        run: node --version
      - name: Run behavioral checks
        run: node --test AO-AI/tests/core.test.mjs
