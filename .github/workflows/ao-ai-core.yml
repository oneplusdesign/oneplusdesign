name: AΩ AI — core tests
# PAUSED at repository owner's explicit request on 2026-11-09.
# No schedules, push or pull_request triggers. All jobs intentionally disabled.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show runtime
        run: node --version && python3 --version
      - name: Run deterministic action-gate checks
        run: node --test AO-AI/tests/core.test.mjs
      - name: Run synthetic optimization benchmark tests
        run: python3 -m unittest discover -s AO-AI/research -p 'test_*.py' -v
      - name: Execute reference benchmark
        run: python3 AO-AI/research/benchmark.py
